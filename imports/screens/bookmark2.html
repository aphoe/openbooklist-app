<!DOCTYPE html>

<html class="h-full" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard - Reference Adaptation</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style data-purpose="custom-background">
        /* Recreating the dotted grid background from the reference image */
        .bg-dotted-grid {
            background-color: #f8fafc;
            /* slate-50 */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            /* slate-300 dots */
            background-size: 24px 24px;
        }
    </style>
    <style data-purpose="scrollbar-styling">
        /* Minimalist scrollbar for a cleaner mobile-like feel */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-dotted-grid min-h-full font-sans text-slate-900 pb-24">
    <!-- BEGIN: MainHeader -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 p-4">
        <div class="max-w-4xl mx-auto flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold text-indigo-700 tracking-tight">OpenBookList</h1>
                <!-- User Profile Avatar -->
                <div
                    class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center border border-indigo-200">
                    <svg class="h-6 w-6 text-indigo-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
            </div>
            <!-- Search Bar Container -->
            <div class="relative" data-purpose="search-bar">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <input
                    class="block w-full pl-10 pr-3 py-2 border border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all"
                    placeholder="Search your bookmarks..." type="text" />
            </div>
        </div>
    </header>
    <!-- END: MainHeader -->
    <main class="max-w-4xl mx-auto p-4 space-y-8">
        <!-- BEGIN: CategoriesGrid -->
        <section data-purpose="categories">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-slate-800">Collections</h2>
                <button class="text-sm text-indigo-600 font-medium">View All</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Work Category -->
                <div
                    class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-start gap-3 transition-transform active:scale-95">
                    <div class="p-2 bg-indigo-50 rounded-lg">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </div>
                    <span class="font-medium">Work</span>
                </div>
                <!-- Inspiration Category -->
                <div
                    class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-start gap-3 transition-transform active:scale-95">
                    <div class="p-2 bg-amber-50 rounded-lg">
                        <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.364-6.364l-.707-.707m1.414 14.142l-.707-.707M12 18v1m4.636-1.414l.707.707M12 7a5 5 0 100 10 5 5 0 000-10z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </div>
                    <span class="font-medium">Inspiration</span>
                </div>
                <!-- Documentation Category -->
                <div
                    class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-start gap-3 transition-transform active:scale-95">
                    <div class="p-2 bg-emerald-50 rounded-lg">
                        <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </div>
                    <span class="font-medium text-sm">Documentation</span>
                </div>
                <!-- Personal Category -->
                <div
                    class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-start gap-3 transition-transform active:scale-95">
                    <div class="p-2 bg-rose-50 rounded-lg">
                        <svg class="w-6 h-6 text-rose-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </div>
                    <span class="font-medium">Personal</span>
                </div>
            </div>
        </section>
        <!-- END: CategoriesGrid -->
        <!-- BEGIN: RecentlySaved -->
        <section data-purpose="recently-saved">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-slate-800">Recently Saved</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Bookmark Card 1 -->
                <article
                    class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex transition-all hover:shadow-md">
                    <div class="w-28 flex-shrink-0 bg-slate-200">
                        <img alt="Article Preview" class="w-full h-full object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCixC0FfrqObaJYrsu6mE3z31hxIos54ms5wtrvh-I-h6lf6YHlY5tDvNoxROAYBWT-T1pJdHgzOtnjTS04IXBYIlE3RIu7GGakfho7T0tttWNJf8FfD7s6Ky4Bkmx6WfaowULe9FLq3SngkQ8uFlJUDZQfLFNFuI8J5soJ6MVQY3dYdPFL9BwhCxGEYBXM7XD86WO-HD21OGDWX_yur5c01TiGe2Baezze4U7nPV49ueDjhZvBJ5_5zZ4XvQblTI-Ejz5tuN01e2bL" />
                    </div>
                    <div class="p-4 flex flex-col justify-between overflow-hidden">
                        <div>
                            <h3 class="font-semibold text-slate-900 truncate">Modern UI Components 2024</h3>
                            <p class="text-xs text-slate-500 mt-1 truncate">resources.design.com</p>
                        </div>
                        <div class="flex gap-2 mt-3">
                            <span
                                class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] font-bold uppercase rounded-md">Design</span>
                            <span
                                class="px-2 py-0.5 bg-slate-50 text-slate-500 text-[10px] font-bold uppercase rounded-md">New</span>
                        </div>
                    </div>
                </article>
                <!-- Bookmark Card 2 -->
                <article
                    class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex transition-all hover:shadow-md">
                    <div class="w-28 flex-shrink-0 bg-slate-200">
                        <img alt="Article Preview" class="w-full h-full object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMwCKvkKr-GcLqBFVZ2wXzFCbEjoi84iOK6r3ywwb7gBUSZf0C_BUuTPSCMTGuh5DpIPZnKMKlIeqYcVTXPmVmJfJ9uYALZN3Nh5RI-VMutlaUUWkZwYlAE3hAAVj24wQTPLIhPOO0uWTjrIvzQ6AEhVSBfMbeCcpNXnlYAHSS_3BuoDw7hCKZW-1TaPv-zeTCbKAB5Ivo9BRbPaygk3mFEls5iXyqL-E49e5oBL76-or6H8s5ElLnaj1c0aq9jirqJvjF68ws9V6R" />
                    </div>
                    <div class="p-4 flex flex-col justify-between overflow-hidden">
                        <div>
                            <h3 class="font-semibold text-slate-900 truncate">Stripe API References</h3>
                            <p class="text-xs text-slate-500 mt-1 truncate">docs.stripe.com</p>
                        </div>
                        <div class="flex gap-2 mt-3">
                            <span
                                class="px-2 py-0.5 bg-emerald-50 text-emerald-600 text-[10px] font-bold uppercase rounded-md">Dev</span>
                            <span
                                class="px-2 py-0.5 bg-slate-50 text-slate-500 text-[10px] font-bold uppercase rounded-md">Docs</span>
                        </div>
                    </div>
                </article>
            </div>
        </section>
        <!-- END: RecentlySaved -->
        <!-- BEGIN: Favorites -->
        <section data-purpose="favorites-list">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-slate-800">Favorites</h2>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 divide-y divide-slate-100">
                <!-- Favorite Item 1 -->
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xs">
                            GH</div>
                        <div>
                            <p class="font-medium text-sm">GitHub Dashboard</p>
                            <p class="text-xs text-slate-400">github.com</p>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-amber-400 fill-current" viewbox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                        </path>
                    </svg>
                </div>
                <!-- Favorite Item 2 -->
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-white font-bold text-xs">
                            TW</div>
                        <div>
                            <p class="font-medium text-sm">Tailwind Docs</p>
                            <p class="text-xs text-slate-400">tailwindcss.com</p>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-amber-400 fill-current" viewbox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                        </path>
                    </svg>
                </div>
            </div>
        </section>
        <!-- END: Favorites -->
    </main>
    <!-- BEGIN: FloatingActionButton -->
    <button aria-label="Add new bookmark"
        class="fixed bottom-6 right-6 w-16 h-16 bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center transform active:scale-90 transition-all hover:bg-indigo-700 z-50 ring-4 ring-white"
        id="add-bookmark-btn">
        <svg class="h-8 w-8" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
        </svg>
    </button>
    <!-- END: FloatingActionButton -->
    <!-- BEGIN: BottomNavigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-3 flex justify-around items-center z-40">
        <button class="flex flex-col items-center gap-1 text-indigo-600">
            <svg class="w-6 h-6" fill="currentColor" viewbox="0 0 20 20">
                <path
                    d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z">
                </path>
            </svg>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round"
                    stroke-linejoin="round" stroke-width="2"></path>
            </svg>
            <span class="text-[10px] font-bold">Saved</span>
        </button>
        <div class="w-12"></div> <!-- Spacer for FAB -->
        <button class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path d="M7 7h.01M7 11h.01M7 15h.01M13 7h.01M13 11h.01M13 15h.01M17 7h.01M17 11h.01M17 15h.01"
                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
            <span class="text-[10px] font-bold">Grid</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"></path>
            </svg>
            <span class="text-[10px] font-bold">Settings</span>
        </button>
    </nav>
    <!-- END: BottomNavigation -->
    <script data-purpose="interaction-logic">
        // Simple logic for the Floating Action Button interaction
        const fab = document.getElementById('add-bookmark-btn');
        fab.addEventListener('click', () => {
            // In a real app, this would open a modal
            alert('OpenBookList: Creating a new bookmark entry.');
        });
    </script>
</body>

</html>
